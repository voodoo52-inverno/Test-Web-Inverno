<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมงูสุดคลาสสิก</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #1e1e24; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #fff; }
        h1 { margin-bottom: 10px; font-size: 24px; color: #4caf50; }
        #score-board { font-size: 20px; margin-bottom: 15px; }
        #game-container { position: relative; background: #111; border: 4px solid #4caf50; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        canvas { display: block; background: #1a1a1a; }
        
        /* ปุ่มควบคุมสำหรับมือถือ */
        .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 10px; margin-top: 20px; justify-content: center; }
        .btn { background: #333; border: 2px solid #555; color: white; font-size: 20px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
        .btn:active { background: #4caf50; border-color: #fff; }
        .up { grid-column: 2; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <h1>🐍 SNAKE GAME 🍎</h1>
    <div id="score-board">คะแนน: <span id="score">0</span></div>

    <div id="game-container">
        <!-- กระดานเกม -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <!-- ปุ่มกดสำหรับคนเล่นบนมือถือ -->
    <div class="controls">
        <div class="btn up" onclick="changeDirection('UP')">▲</div>
        <div class="btn left" onclick="changeDirection('LEFT')">◀</div>
        <div class="btn down" onclick="changeDirection('DOWN')">▼</div>
        <div class="btn right" onclick="changeDirection('RIGHT')">▶</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }]; // พิกัดเริ่มต้นของงู
        let food = { x: 5, y: 5 }; // พิกัดอาหารลูกแรก
        let dx = 0; // ทิศทางแนวนอน
        let dy = 0; // ทิศทางแนวตั้ง
        let score = 0;
        let gameInterval;

        // เริ่มต้นรันเกม
        function startGame() {
            dx = 1; // ให้งูเดินขวาตอนเริ่มเกม
            dy = 0;
            score = 0;
            snake = [{ x: 10, y: 10 }];
            generateFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(updateGame, 150); // ความเร็วของงู (ยิ่งตัวเลขน้อย ยิ่งเร็ว)
        }

        // ระบบคำนวณและวาดกราฟิก
        function updateGame() {
            // 1. ขยับหัวงูไปข้างหน้า
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // ชนกำแพงหรือชนตัวเอง = แพ้
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount || checkCollision(head)) {
                alert("เกมจบแล้ว! คะแนนของคุณคือ: " + score);
                startGame();
                return;
            }

            snake.unshift(head); // เพิ่มหัวใหม่เข้าไปข้างหน้า

            // 2. ถ้างูกินอาหาร
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood(); // สุ่มอาหารใหม่
            } else {
                snake.pop(); // ตัดหางงูออกถ้าไม่ได้กินอาหาร (เพื่อให้ยาวเท่าเดิม)
            }

            // 3. วาดภาพลงบนหน้าจอ
            ctx.fillStyle = "#1a1a1a"; // เคลียร์หน้าจอเก่า
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดตัวงู
            ctx.fillStyle = "#4caf50";
            snake.forEach(part => ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2));

            // วาดอาหาร
            ctx.fillStyle = "#f44336";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        // ฟังก์ชันเปลี่ยนทิศทาง
        function changeDirection(direction) {
            if (direction === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
            if (direction === 'UP' && dy === 0) { dx = 0; dy = -1; }
            if (direction === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
            if (direction === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
        }

        // ตรวจสอบการกดปุ่มบนคีย์บอร์ดคอมพิวเตอร์
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") changeDirection('LEFT');
            if (e.key === "ArrowUp") changeDirection('UP');
            if (e.key === "ArrowRight") changeDirection('RIGHT');
            if (e.key === "ArrowDown") changeDirection('DOWN');
        });

        // สุ่มจุดวางอาหารใหม่ที่ไม่ทับตัวงู
        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            if (snake.some(part => part.x === food.x && part.y === food.y)) {
                generateFood();
            }
        }

        // เช็กว่างูชนตัวเองไหม
        function checkCollision(head) {
            return snake.some((part, index) => index !== 0 && part.x === head.x && part.y === head.y);
        }

        startGame(); // เปิดเว็บมาให้เริ่มเล่นทันที
    </script>
</body>
</html>
